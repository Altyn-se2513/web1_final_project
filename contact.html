<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Digital Book Collection</title>
  <script src="js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page-grid mx-auto">
    <header id="main-header" class="px-3 px-lg-4 py-3">
      <nav class="navbar navbar-expand-xxl navbar-dark w-100">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Book Collection</a>
          <button class="theme-toggle" type="button" id="theme-toggle">☾</button>
        </div>
      </nav>
    </header>

    <main class="main-content p-3 p-lg-4">
      <h1>Contact Us</h1>
      <p>We would love to hear from you.</p>

      <h2 class="mt-4 mt-lg-5">Send Us a Message</h2>
      <form id="contact-form" action="#" method="post" class="mt-4 mb-5 form-narrow" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name:</label>
          <input type="text" class="form-control" id="name" placeholder="Your full name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address:</label>
          <input type="text" inputmode="email" class="form-control" id="email" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold">Phone Number:</label>
          <input type="text" inputmode="tel" class="form-control" id="phone" placeholder="+7 777 123 45 67">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label fw-semibold">Message:</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..."></textarea>
        </div>
        <p id="contact-error" class="auth-error p-3" hidden></p>
        <p id="contact-success" class="auth-success p-3" hidden></p>
        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </main>

    <footer class="p-4">
      <p id="datetime" class="footer-datetime"></p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader — Digital Book Collection</title>
  <script src="js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page-grid mx-auto">
    <header id="main-header" class="px-3 px-lg-4 py-3">
      <nav class="navbar navbar-expand-xxl navbar-dark w-100">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Book Collection</a>
          <button class="theme-toggle" type="button" id="theme-toggle">☾</button>
        </div>
      </nav>
    </header>

    <main class="main-content p-3 p-lg-4">
      <h1>Read Online</h1>
      <p>Select a book to fetch real text from Project Gutenberg API.</p>

      <div class="reader-toolbar p-3 mb-4">
        <span class="reader-book-title p-2">
          <strong>Book:</strong> <span id="book-title-display">—</span>
        </span>

        <select id="book-select" class="form-select book-select" aria-label="Choose book">
          <option value="">— Switch book —</option>
          <option value="Pride and Prejudice">Pride and Prejudice</option>
          <option value="The Great Gatsby">The Great Gatsby</option>
          <option value="Moby Dick">Moby Dick</option>
          <option value="Frankenstein">Frankenstein</option>
          <option value="Dracula">Dracula</option>
          <option value="Alice's Adventures in Wonderland">Alice in Wonderland</option>
        </select>
      </div>

      <article class="book-reader p-4 p-lg-5 mx-auto" id="book-reader"></article>
    </main>

    <footer class="p-4">
      <p id="datetime" class="footer-datetime"></p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing — Digital Book Collection</title>
  <script src="js/theme-init.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page-grid mx-auto">
    <header id="main-header" class="px-3 px-lg-4 py-3">
      <nav class="navbar navbar-expand-xxl navbar-dark w-100">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Book Collection</a>
          <button class="theme-toggle" type="button" id="theme-toggle">☾</button>
        </div>
      </nav>
    </header>

    <main class="main-content p-3 p-lg-4">
      <h1>Reader Membership Plans</h1>
      
      <div class="btn-group mb-4 mt-3">
        <input type="radio" class="btn-check" name="billing" id="billing-monthly" value="monthly" checked>
        <label class="btn btn-outline-primary" for="billing-monthly">Monthly</label>
        <input type="radio" class="btn-check" name="billing" id="billing-yearly" value="yearly">
        <label class="btn btn-outline-primary" for="billing-yearly">Yearly (save 20%)</label>
      </div>
      <p id="billing-note" class="billing-note">Prices shown per month.</p>

      <div class="pricing-grid mb-4 mt-3">
        <div class="pricing-card">
          <h3>Standard Club</h3>
          <div class="price" data-monthly="9.99">$9.99<small> / month</small></div>
        </div>
        <div class="pricing-card featured">
          <h3>Premium Unlimited</h3>
          <div class="price" data-monthly="19.99">$19.99<small> / month</small></div>
        </div>
      </div>
    </main>

    <footer class="p-4">
      <p id="datetime" class="footer-datetime"></p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>
